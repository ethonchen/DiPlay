name: Verify locally signed Q7 APK
on:
  push:
    branches: [verify/q7-update1-apk-20261027]
    paths: [.github/workflows/q7-final-apk-verify.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0
      - name: Download the public locally signed APK; no private key is transmitted
        run: |
          gh api repos/ethonchen/DiPlay/git/blobs/f2e77f76c34fce766c34f202168273c1b1f61c76 --jq .content | base64 --decode > candidate.apk
          printf '%s  %s\n' baf042d941b78d014889050007c8394950887c76639faac2cbe4934e6588192a candidate.apk | sha256sum --check --strict
          python3 scripts/verify_android6_apk.py candidate.apk --build-tools "$ANDROID_HOME/build-tools/36.0.0" --standalone --optimized --signer-sha256 42dca8935a4e53f385388e4ed3058edc4e240107c057723a21574dde9d5a2928
          python3 scripts/prepare_q7_release.py candidate.apk --build-tools "$ANDROID_HOME/build-tools/36.0.0" --output release
          curl --fail --location --retry 3 https://github.com/ethonchen/DiPlay/releases/download/v0.2.21-android6-q7-upstream1/DiPlay-Q7-0.2.21-upstream1.apk -o previous.apk
      - run: sudo chmod 666 /dev/kvm
      - name: Validate the exact final signed APK on Android 6
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 23
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            bash scripts/smoke_q7_upgrade.sh previous.apk candidate.apk
            bash scripts/smoke_android6.sh candidate.apk
            bash scripts/smoke_q7_runtime.sh candidate.apk
            adb push candidate.apk /data/local/tmp/q7-update-network.apk
            adb shell 'CLASSPATH=/data/local/tmp/q7-update-network.apk app_process /system/bin com.shilapi.xcertplay.update.Q7UpdateNetworkProbe "https://api.github.com/repos/ethonchen/DiPlay/releases?per_page=3" "https://gh-proxy.com/https://api.github.com/repos/ethonchen/DiPlay/releases?per_page=3" "https://ghproxy.net/https://api.github.com/repos/ethonchen/DiPlay/releases?per_page=3" "https://gh-proxy.com/https://github.com/ethonchen/DiPlay/releases/download/v0.2.21-android6-q7-upstream1/SHA256SUMS.txt" "https://ghproxy.net/https://github.com/ethonchen/DiPlay/releases/download/v0.2.21-android6-q7-upstream1/SHA256SUMS.txt" "https://github.com/ethonchen/DiPlay/releases/download/v0.2.21-android6-q7-upstream1/SHA256SUMS.txt" "https://gh-proxy.com/https://github.com/ethonchen/DiPlay/releases/latest/download/SHA256SUMS.txt" "https://ghproxy.net/https://github.com/ethonchen/DiPlay/releases/latest/download/SHA256SUMS.txt"' > android6-smoke/https-probe.txt
            cat android6-smoke/https-probe.txt
            if grep -Eq 'SSLHandshakeException|CertPathValidatorException|Update CA bundle' android6-smoke/https-probe.txt; then exit 1; fi
            grep -E 'Q7-UPDATE-HTTPS https://(gh-proxy.com|ghproxy.net)/https://github.com/.*status=200 prefix=3a4a96f35370da9903b52eddabd708f719ab28f58716b217e867b6e4135906e0' android6-smoke/https-probe.txt
      - name: Upload only the final release files after Android 6 validation
        uses: actions/upload-artifact@v4
        with:
          name: DiPlay-Q7-final-release
          path: release/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q7-final-android6-evidence
          path: android6-smoke/
