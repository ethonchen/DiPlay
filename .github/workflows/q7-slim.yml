name: Q7 optimized APK
on:
  push:
    branches: [main, perf/q7-slim, "merge/upstream-**", "fix/q7-audio-**", "experiment/q7-hotspot-restore-**", "fix/q7-control-**", "fix/q7-wheel-**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: q7-slim-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    if: github.repository == 'ethonchen/DiPlay'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reject credentials in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Required tests, lint and source debug builds
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :home:testDebugUnitTest :shared:lintDebug :common:lintDebug :mobile:lintDebug :home:lintDebug :maphost:lintDebug :mobile:assembleDebug :home:assembleDebug :maphost:assembleDebug --continue --stacktrace
      - name: Full test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q7-full-checks
          path: |
            shared/build/reports/tests/
            common/build/reports/tests/
            samples/home/build/reports/tests/
            common/build/reports/
            mobile/build/reports/
  build:
    if: github.repository == 'ethonchen/DiPlay'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reject credentials in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: FYT focus and Binder regression tests
        run: ./gradlew :common:testDebugUnitTest --tests com.shilapi.xcertplay.FytWheelKeysTest --tests com.shilapi.xcertplay.FytKeyFocusTest --tests com.shilapi.xcertplay.FytLegacyMediaKeysTest --tests com.shilapi.xcertplay.FytBspProtocolTest --stacktrace
      - name: Restore the permanent Q7 update signer
        uses: ./.github/actions/q7-signing
        with:
          keystore-base64: ${{ secrets.DIPLAY_Q7_KEYSTORE_BASE64 }}
      - name: Provision the same public experimental identity as the tested APK
        run: |
          curl --fail --location --retry 3 https://github.com/shihabal3amri/DiPlay/releases/download/v0.2.14/DiPlay-0.2.14.apk -o "$RUNNER_TEMP/upstream-public.apk"
          python3 scripts/provision_android6_test_identity.py "$RUNNER_TEMP/upstream-public.apk" "$RUNNER_TEMP/android6-runtime" --sha256 62b31f79db32bc7c85013ae830460b697a5952fad571ed0030b97341dde0b2e3 --allow-public-experimental-identity
      - name: Optimize, lint and verify the standalone APK
        env:
          DIPLAY_AUTH_ASSETS_DIR: ${{ runner.temp }}/android6-runtime
        run: |
          ./gradlew :mobile:lintQ7 :mobile:assembleStandaloneQ7 --stacktrace
          python3 scripts/verify_android6_apk.py mobile/build/outputs/apk/q7/mobile-q7.apk --build-tools "$ANDROID_HOME/build-tools/36.0.0" --standalone --optimized --signer-sha256 42dca8935a4e53f385388e4ed3058edc4e240107c057723a21574dde9d5a2928
          sha256sum mobile/build/outputs/apk/q7/mobile-q7.apk > mobile/build/outputs/apk/q7/SHA256SUMS
          python3 scripts/prepare_q7_release.py mobile/build/outputs/apk/q7/mobile-q7.apk --build-tools "$ANDROID_HOME/build-tools/36.0.0" --output mobile/build/outputs/q7-release
      - name: Q7 standalone optimized APK
        uses: actions/upload-artifact@v4
        with:
          name: DiPlay-Q7-slim-standalone
          path: |
            mobile/build/outputs/apk/q7/mobile-q7.apk
            mobile/build/outputs/apk/q7/SHA256SUMS
          if-no-files-found: error
      - name: Q7 release files and automatic-update manifest
        uses: actions/upload-artifact@v4
        with:
          name: DiPlay-Q7-release
          path: mobile/build/outputs/q7-release/
          if-no-files-found: error
      - name: Test and optimization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q7-slim-reports
          path: |
            shared/build/reports/tests/
            common/build/reports/tests/
            samples/home/build/reports/tests/
            common/build/reports/
            mobile/build/reports/
            mobile/build/outputs/mapping/q7/
      - name: Remove temporary identity inputs
        if: always()
        run: rm -rf "$RUNNER_TEMP/android6-runtime" "$RUNNER_TEMP/upstream-public.apk"
  api23-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@v4
        with:
          name: DiPlay-Q7-slim-standalone
          path: apk
      - name: Download the previously released APK for an in-place upgrade check
        run: curl --fail --location --retry 3 https://github.com/ethonchen/DiPlay/releases/download/v0.2.21-android6-q7-upstream1/DiPlay-Q7-0.2.21-upstream1.apk -o apk/previous-q7.apk
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Run the optimized APK on Android 6
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 23
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            bash scripts/smoke_q7_upgrade.sh apk/previous-q7.apk apk/mobile-q7.apk
            bash scripts/smoke_android6.sh apk/mobile-q7.apk
            bash scripts/smoke_q7_runtime.sh apk/mobile-q7.apk
      - name: Android 6 optimized APK evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q7-slim-android6-smoke
          path: android6-smoke/
  media-key-system-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Verify Android 6 system media-key routing with and without the flags
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 23
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/smoke_legacy_media_keys.sh
      - name: Media-key routing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android6-media-key-routing
          path: android6-smoke/

  publish:
    if: github.repository == 'ethonchen/DiPlay' && github.ref == 'refs/heads/main'
    needs: [checks, build, api23-smoke, media-key-system-check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DiPlay-Q7-release
          path: release
      - name: Publish the exact APK that passed all checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import hashlib, json, pathlib
          root = pathlib.Path('release')
          info = json.loads((root / 'update.json').read_text())
          apk = root / info['apkName']
          assert apk.stat().st_size == info['size']
          assert hashlib.sha256(apk.read_bytes()).hexdigest() == info['sha256']
          PYCODE
          tag=$(python3 -c "import json; print(json.load(open('release/update.json'))['tagName'])")
          apk=$(python3 -c "import json; print(json.load(open('release/update.json'))['apkName'])")
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; preserve its published assets."
            exit 0
          fi
          cp docs/RELEASE-NOTES-Q7-UPDATE.md release/notes.md
          printf '\n主干：`%s`\n构建与检查：https://github.com/%s/actions/runs/%s\n' \
            "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> release/notes.md
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "HHQ Q7 Android 6 — ${tag#v}" --notes-file release/notes.md \
            "release/$apk" release/SHA256SUMS.txt release/update.json
