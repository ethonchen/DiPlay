name: Q7 optimized APK
on:
  push:
    branches: [perf/q7-slim]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: q7-slim-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'ethonchen/DiPlay'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reject credentials in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Restore the tested APK signing key from main
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: diplay-android6-debug-signing-v1
          fail-on-cache-miss: true
      - name: Require the existing update key
        run: |
          test -s "$HOME/.android/debug.keystore"
          echo "DIPLAY_DEBUG_KEYSTORE_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
      - name: Required tests, lint and source debug builds
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :home:testDebugUnitTest :shared:lintDebug :common:lintDebug :mobile:lintDebug :home:lintDebug :maphost:lintDebug :mobile:assembleDebug :home:assembleDebug :maphost:assembleDebug --continue --stacktrace
      - name: Provision the same public experimental identity as the tested APK
        run: |
          curl --fail --location --retry 3 https://github.com/shihabal3amri/DiPlay/releases/download/v0.2.14/DiPlay-0.2.14.apk -o "$RUNNER_TEMP/upstream-public.apk"
          python3 scripts/provision_android6_test_identity.py "$RUNNER_TEMP/upstream-public.apk" "$RUNNER_TEMP/android6-runtime" --sha256 62b31f79db32bc7c85013ae830460b697a5952fad571ed0030b97341dde0b2e3 --allow-public-experimental-identity
      - name: Optimize, lint and verify the standalone APK
        env:
          DIPLAY_AUTH_ASSETS_DIR: ${{ runner.temp }}/android6-runtime
        run: |
          ./gradlew :mobile:lintQ7 :mobile:assembleStandaloneQ7 --stacktrace
          python3 scripts/verify_android6_apk.py mobile/build/outputs/apk/q7/mobile-q7.apk --build-tools "$ANDROID_HOME/build-tools/36.0.0" --standalone --optimized --signer-sha256 5113b2d373d54973ac2fe837ab1d0f4132dba3e4fba64d4027bd4d41823d163f
          sha256sum mobile/build/outputs/apk/q7/mobile-q7.apk > mobile/build/outputs/apk/q7/SHA256SUMS
      - name: Q7 standalone optimized APK
        uses: actions/upload-artifact@v4
        with:
          name: DiPlay-Q7-slim-standalone
          path: |
            mobile/build/outputs/apk/q7/mobile-q7.apk
            mobile/build/outputs/apk/q7/SHA256SUMS
          if-no-files-found: error
      - name: Test and optimization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q7-slim-reports
          path: |
            shared/build/reports/tests/
            common/build/reports/tests/
            samples/home/build/reports/tests/
            mobile/build/reports/
            mobile/build/outputs/mapping/q7/
      - name: Remove temporary identity inputs
        if: always()
        run: rm -rf "$RUNNER_TEMP/android6-runtime" "$RUNNER_TEMP/upstream-public.apk"
  api23-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@v4
        with:
          name: DiPlay-Q7-slim-standalone
          path: apk
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Run the optimized APK on Android 6
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 23
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            bash scripts/smoke_android6.sh apk/mobile-q7.apk
            bash scripts/smoke_q7_runtime.sh apk/mobile-q7.apk
      - name: Android 6 optimized APK evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q7-slim-android6-smoke
          path: android6-smoke/
