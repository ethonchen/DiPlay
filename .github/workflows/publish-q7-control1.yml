name: Publish Q7 control1 release
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-q7-control1.yml]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1fbc9ae8c151372be053e01cc0c34fc10b075dea
          fetch-depth: 0
      - name: Verify tested source matches merged source
        run: |
          test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse 5c482a6b5ccaa3c6bddca81951d7238772637cfb^{tree})"
      - uses: actions/download-artifact@v4
        with:
          name: DiPlay-Q7-slim-standalone
          run-id: 38560252598
          github-token: ${{ github.token }}
          path: apk
      - name: Verify and publish tested APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BODY: "适用于 HHQ Q7 / Android 6 / 2.4 GHz Wi-Fi。\n\n- 合入 PR #8：独立接收和解析 Wi-Fi iAP2 控制消息，降低队列拥塞引起的断线风险。\n- 控制队列保留顺序，限制为 256 条 / 1 MiB，增加队列深度及等待时间日志。\n- 运行期间控制消息发送等待上限 5 秒；已建立会话的恢复窗口内，重试间隔上限 8 秒。\n- 保留热点配置恢复、音乐播放修复及导航播报压低音乐。\n\n原包名、原签名，versionCode 42，可直接覆盖安装并保留设置。\n2630 项单元测试、lint、debug/优化构建、签名验证及 Android 6 模拟器检查通过。实车效果待确认。\n\n主干合并提交：1fbc9ae8c151372be053e01cc0c34fc10b075dea\n构建源提交：5c482a6b5ccaa3c6bddca81951d7238772637cfb（发布前校验代码树一致）\n构建与测试：https://github.com/ethonchen/DiPlay/actions/runs/38560252598\n"
        run: |
          cd apk
          echo '077bc5705b2fda54062401414d4fce93944816120a9d7a501a2b7e9692731c6e  mobile-q7.apk' | sha256sum -c -
          mv mobile-q7.apk DiPlay-Q7-0.2.18-control1.apk
          sha256sum DiPlay-Q7-0.2.18-control1.apk > SHA256SUMS.txt
          printf '%s' "$RELEASE_BODY" > notes.md
          gh release create v0.2.18-android6-q7-control1 DiPlay-Q7-0.2.18-control1.apk SHA256SUMS.txt --repo ethonchen/DiPlay --target 1fbc9ae8c151372be053e01cc0c34fc10b075dea --title 'HHQ Q7 Android 6 — iAP2 控制队列与断线恢复优化' --notes-file notes.md --prerelease
