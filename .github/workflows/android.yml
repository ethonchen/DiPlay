name: Android checks
on:
  push:
    branches: [main, feat/android-6-port]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Keep test APK update signing stable in this fork
        if: github.repository == 'ethonchen/DiPlay' && github.event_name == 'push'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: diplay-android6-debug-signing-v1
      - name: Prepare the explicit cached fork test signing key
        if: github.repository == 'ethonchen/DiPlay' && github.event_name == 'push'
        run: |
          mkdir -p "$HOME/.android"
          if ! test -f "$HOME/.android/debug.keystore"; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=DiPlay Android 6 Test" -keyalg RSA -keysize 2048 -validity 10000
          fi
          echo "DIPLAY_DEBUG_KEYSTORE_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
      - name: Unit tests, lint and source-only debug build
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :home:testDebugUnitTest :shared:lintDebug :common:lintDebug :mobile:lintDebug :home:lintDebug :maphost:lintDebug :mobile:assembleDebug :home:assembleDebug :maphost:assembleDebug --continue --stacktrace
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            shared/build/reports/android6-api-lint.txt
            common/build/reports/tests/
            common/build/reports/android6-api-lint.txt
            mobile/build/reports/lint-results-debug.html
            samples/home/build/reports/tests/
            samples/home/build/reports/lint-results-debug.html
            samples/maphost/build/reports/lint-results-debug.html
      - name: API compatibility findings
        if: failure()
        run: |
          for report in shared/build/reports/android6-api-lint.txt common/build/reports/android6-api-lint.txt; do
            if test -f "$report"; then cat "$report"; fi
          done
      - name: Verify source-only API-23 packaging
        run: python3 scripts/verify_android6_apk.py mobile/build/outputs/apk/debug/mobile-debug.apk --build-tools "$ANDROID_HOME/build-tools/36.0.0"
      - name: Source-only Android 6 APK
        uses: actions/upload-artifact@v4
        with:
          name: DiPlay-Android6-source-only
          path: mobile/build/outputs/apk/debug/mobile-debug.apk
          if-no-files-found: error
      # Explicit owner-selected public test material. Ordinary builds and PRs remain identity-free.
      - name: Provision selected public experimental identity outside source
        if: github.repository == 'ethonchen/DiPlay' && github.event_name == 'push' && (github.ref == 'refs/heads/feat/android-6-port' || github.ref == 'refs/heads/main')
        run: |
          curl --fail --location --retry 3 https://github.com/shihabal3amri/DiPlay/releases/download/v0.2.14/DiPlay-0.2.14.apk -o "$RUNNER_TEMP/upstream-public.apk"
          python3 scripts/provision_android6_test_identity.py "$RUNNER_TEMP/upstream-public.apk" "$RUNNER_TEMP/android6-runtime" --sha256 62b31f79db32bc7c85013ae830460b697a5952fad571ed0030b97341dde0b2e3 --allow-public-experimental-identity
      - name: Build and verify standalone Android 6 test APK
        if: github.repository == 'ethonchen/DiPlay' && github.event_name == 'push' && (github.ref == 'refs/heads/feat/android-6-port' || github.ref == 'refs/heads/main')
        env:
          DIPLAY_AUTH_ASSETS_DIR: ${{ runner.temp }}/android6-runtime
        run: |
          ./gradlew :mobile:assembleStandaloneDebug --stacktrace
          python3 scripts/verify_android6_apk.py mobile/build/outputs/apk/debug/mobile-debug.apk --build-tools "$ANDROID_HOME/build-tools/36.0.0" --standalone
      - name: Standalone Android 6 car-test APK
        if: github.repository == 'ethonchen/DiPlay' && github.event_name == 'push' && (github.ref == 'refs/heads/feat/android-6-port' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: DiPlay-Android6-standalone-experimental
          path: mobile/build/outputs/apk/debug/mobile-debug.apk
          if-no-files-found: error
      - name: Remove temporary public identity material
        if: always()
        run: rm -rf "$RUNNER_TEMP/android6-runtime" "$RUNNER_TEMP/upstream-public.apk"
  api23-smoke:
    if: github.repository == 'ethonchen/DiPlay' && github.event_name == 'push' && (github.ref == 'refs/heads/feat/android-6-port' || github.ref == 'refs/heads/main')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@v4
        with:
          name: DiPlay-Android6-standalone-experimental
          path: apk
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Install and open Settings on Android 6
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 23
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/smoke_android6.sh apk/mobile-debug.apk
      - name: Android 6 device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android6-device-smoke
          path: android6-smoke/
