name: Q7 four-core 2 GB audio investigation
on:
  push:
    branches: [test/q7-audio-hardware-20261009]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  api23-audio-four-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37876597044
          name: q7-audio-probe-build
          path: probe-build
      - name: AAC-LC 48 kHz stereo fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'sine=frequency=440:sample_rate=48000:duration=4' -ac 2 -c:a aac -profile:a aac_low -b:a 128k -f adts fixture.aac
          sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 23
          arch: x86_64
          target: google_apis
          cores: 4
          ram-size: 2048M
          heap-size: 128M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -skin 1024x600 -noaudio
          script: bash scripts/probes/run_q7_audio.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q7-api23-four-core-audio-evidence
          path: q7-audio-evidence/
          if-no-files-found: error
