name: Publish verified Q7 wheel-key APK
on:
  push:
    branches: [release/q7-wheel1-verified]
permissions:
  contents: read
concurrency:
  group: publish-q7-wheel1-verified
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'ethonchen/DiPlay'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_COMMIT: 'ac18a8365fb0d7bd81b3d7af3caf00f649e7d3b0'
      TESTED_COMMIT: 'd527c56c6c7d0f95d6b3c239d1b9258a37f4b480'
      TESTED_TREE: '8c52c95e82e8d9b85fd98836aa69548ff881797b'
      BUILD_RUN: '39004226796'
      CHECK_RUN: '39004230119'
    steps:
      - name: Require successful checks and the identical merged code tree
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          for run in "$BUILD_RUN" "$CHECK_RUN"; do
            test "$(gh api "repos/$repo/actions/runs/$run" --jq .conclusion)" = success
            test "$(gh api "repos/$repo/actions/runs/$run" --jq .head_sha)" = "$TESTED_COMMIT"
          done
          test "$(gh api "repos/$repo/git/commits/$TESTED_COMMIT" --jq .tree.sha)" = "$TESTED_TREE"
          test "$(gh api "repos/$repo/git/commits/$SOURCE_COMMIT" --jq .tree.sha)" = "$TESTED_TREE"
          test "$(gh api "repos/$repo/git/refs/heads/main" --jq .object.sha)" = "$SOURCE_COMMIT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - name: Download and checksum the exact API-23-tested APK
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --name DiPlay-Q7-slim-standalone --dir artifacts
          expected="$(cut -d' ' -f1 artifacts/SHA256SUMS)"
          test "$(printf %s "$expected" | wc -c)" = 64
          printf '%s  %s\n' "$expected" artifacts/mobile-q7.apk | sha256sum --check --strict -
          mkdir release
          cp artifacts/mobile-q7.apk release/DiPlay-Q7-0.2.20-wheel1.apk
          (cd release && sha256sum DiPlay-Q7-0.2.20-wheel1.apk > SHA256SUMS.txt)
      - name: Publish the owner-requested APK release
        shell: bash
        run: |
          set -euo pipefail
          tag=v0.2.20-android6-q7-wheel1
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exit 0; fi
          cp docs/RELEASE-NOTES-Q7-WHEEL1.md release/notes.md
          printf '\nMain commit: %s\nTested commit: %s (identical tree)\nBuild and Android 6 checks: https://github.com/%s/actions/runs/%s\nFull checks: https://github.com/%s/actions/runs/%s\n\n' \
            "$SOURCE_COMMIT" "$TESTED_COMMIT" "$GITHUB_REPOSITORY" "$BUILD_RUN" \
            "$GITHUB_REPOSITORY" "$CHECK_RUN" >> release/notes.md
          cat release/SHA256SUMS.txt >> release/notes.md
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_COMMIT" \
            --title 'HHQ Q7 Android 6 — 方向盘切歌修复（wheel1）' --notes-file release/notes.md \
            release/DiPlay-Q7-0.2.20-wheel1.apk release/SHA256SUMS.txt
