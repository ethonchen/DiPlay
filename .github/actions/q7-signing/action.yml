name: Restore the permanent Q7 update signing key
description: Load the new permanent Q7 signing key from an encrypted repository secret.
inputs:
  keystore-base64:
    description: Permanent Q7 keystore encoded as base64, from DIPLAY_Q7_KEYSTORE_BASE64.
    required: false
runs:
  using: composite
  steps:
    - name: Restore and verify the permanent signer, without generating a replacement
      shell: bash
      env:
        Q7_KEYSTORE_BASE64: ${{ inputs.keystore-base64 }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import base64, os, pathlib
        key = pathlib.Path.home() / '.android/debug.keystore'
        encoded = os.environ.get('Q7_KEYSTORE_BASE64', '').strip()
        if encoded:
            key.parent.mkdir(parents=True, exist_ok=True)
            key.write_bytes(base64.b64decode(''.join(encoded.split()), validate=True))
            key.chmod(0o600)
        if not key.is_file() or key.stat().st_size == 0:
            raise SystemExit('Permanent Q7 signing key unavailable. Configure DIPLAY_Q7_KEYSTORE_BASE64; never generate another update key.')
        PY
        fingerprint=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')
        test "$fingerprint" = 42dca8935a4e53f385388e4ed3058edc4e240107c057723a21574dde9d5a2928
        echo "DIPLAY_DEBUG_KEYSTORE_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
